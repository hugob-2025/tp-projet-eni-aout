name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  frontend-tests:
    name: Tests Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installation des dépendances
        working-directory: frontend
        run: npm ci

      - name: Tests Angular
        working-directory: frontend
        run: npm test

      - name: Build Angular
        working-directory: frontend
        run: npm run build


  backend-tests:
    name: Tests Backend
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: todolist_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Installation des dépendances
        working-directory: backend
        run: npm ci

      - name: Initialisation de la base MySQL
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -proot todolist_db < backend/scriptSQL.sql

      - name: Tests Jest
        working-directory: backend
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: todolist_db
          DB_DIALECT: mysql
        run: npm test


  docker-build:

        name: Build et Push Docker
        runs-on: ubuntu-latest

        needs:
          - frontend-tests
          - backend-tests

        steps:
          - name: Récupération du code
            uses: actions/checkout@v4

          - name: Connexion à Docker Hub
            uses: docker/login-action@v3
            with:
              username: ${{ secrets.DOCKERHUB_USERNAME }}
              password: ${{ secrets.DOCKERHUB_TOKEN }}

          - name: Build image Backend
            run: |
              docker build \
                -t hugob2025/todolist-backend:1.0 \
                ./backend

          - name: Build image Frontend
            run: |
              docker build \
                -t hugob2025/todolist-frontend:1.1 \
                ./frontend

          - name: Push image Backend
            run: |
              docker push hugob2025/todolist-backend:1.0

          - name: Push image Frontend
            run: |
              docker push hugob2025/todolist-frontend:1.1
